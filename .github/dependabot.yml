version: 2
updates:
  # Application dependencies (pnpm, package.json at repo root).
  # This repo integrates Stripe, Supabase, Datadog, and Resend directly, so
  # security-relevant bumps here matter — group non-major updates to keep
  # the PR count sane and let majors land individually for review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions used by ci.yml, claude.yml, and claude-code-review.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"

  # containers/function/Dockerfile — the OCI Vercel Function service (node:20-alpine).
  #
  # Major bumps are ignored on purpose. The Node major is a coupled, deliberate
  # decision across package.json `engines.node`, .nvmrc, and the CI setup-node
  # step (see CLAUDE.md); Dependabot proposing node:26-alpine here would put the
  # container on a different major than the app builds and tests against.
  # Bumping Node is a repo-wide change, not a Dockerfile change.
  - package-ecosystem: "docker"
    directory: "/containers/function"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore"
      include: "scope"
