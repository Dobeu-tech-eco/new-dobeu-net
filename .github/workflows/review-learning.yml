name: Review learning

# Once a week, sort last week's Claude review comments into fixed vs ignored and
# open a PR that updates the learned rules in REVIEW.md. Never pushes to main:
# each run writes to its own dated branch and opens a PR for a human to merge.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of review comments to read"
        default: "7"

concurrency:
  group: review-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update REVIEW.md from last week's reviews
        id: learn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.REVIEW_LEARNING_MODEL }}
          REVIEW_BOT_PATTERN: ${{ vars.REVIEW_BOT_PATTERN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: node .github/scripts/review-learning.mjs

      - name: Open a PR if the rules changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.learn.outputs.summary }}
        run: |
          if git diff --quiet -- REVIEW.md; then
            echo "No rule changes this week."
            exit 0
          fi
          branch="review-learning/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add REVIEW.md
          git commit -m "chore(review): update learned review rules"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(review): weekly learned review rules" \
            --body "$(printf '%s\n\nGenerated by the Review learning workflow. Merge to apply, edit the branch to adjust, or close to discard.\n\nRun: %s' "$SUMMARY" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
