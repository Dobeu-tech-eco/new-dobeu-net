name: Update visual snapshots

# Playwright visual baselines are platform-specific (`*-linux.png`) and cannot be
# regenerated on a developer's Windows or macOS machine — the bytes will differ
# even when the page is identical. This workflow regenerates them on the same
# ubuntu-latest image CI compares against, then commits them to the branch.
#
# Run it whenever an intended UI/content change makes e2e/visual/* fail:
#   gh workflow run update-visual-snapshots.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-visual-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Regenerate baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Playwright exits non-zero on the run that writes new baselines, which is
      # expected — the commit step below is the real signal.
      - name: Regenerate snapshots
        continue-on-error: true
        run: pnpm test:e2e -- --update-snapshots

      - name: Commit updated baselines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 'e2e/**/*.png'
          if git diff --cached --quiet; then
            echo "No baseline changes — snapshots already match."
            exit 0
          fi
          git diff --cached --name-only
          git commit \
            -m "chore(e2e): regenerate visual baselines on linux" \
            -m "Regenerated by update-visual-snapshots.yml so the committed *-linux.png baselines match what CI renders."
          git push origin HEAD:${{ github.ref_name }}
