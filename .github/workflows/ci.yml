name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      # Reports coverage; does not gate. vitest.config.ts intentionally sets no
      # thresholds yet — see the comment there. Read the text-summary in this
      # job's log, or download the lcov artifact, to establish the real number
      # before turning this into a gate.
      - name: Coverage (report only)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: notify vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - new-dobeu-net: lint"
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Local Supabase stack so e2e/tickets.spec.ts runs instead of skipping.
      # No GitHub secrets: the stack uses Supabase's fixed local demo keys
      # (printed by `supabase start`), masked below for later steps.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime

      - name: Export Supabase env for tests
        run: |
          set -euo pipefail
          status="$(supabase status -o env)"
          get() {
            printf '%s\n' "$status" | sed -n "s/^$1=//p" | head -n1 | tr -d '"\r'
          }
          api_url="$(get API_URL)"
          anon_key="$(get ANON_KEY)"
          service_key="$(get SERVICE_ROLE_KEY)"
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"
          for v in "$api_url" "$anon_key" "$service_key"; do
            if [ -z "$v" ]; then
              echo "Missing value in supabase status output" >&2
              exit 1
            fi
          done
          {
            echo "NEXT_PUBLIC_VERCEL_SUPABASE_URL=$api_url"
            echo "VERCEL_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_VERCEL_SUPABASE_ANON_KEY=$anon_key"
            echo "VERCEL_SUPABASE_SERVICE_ROLE_KEY=$service_key"
          } >> "$GITHUB_ENV"

      - name: Database RLS tests (pgTAP)
        run: supabase test db

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: notify vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - new-dobeu-net: e2e"
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm lighthouse:ci

      - name: notify vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - new-dobeu-net: lighthouse"
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
