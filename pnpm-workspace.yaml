# pnpm workspace config (compatible with pnpm 10).
# onlyBuiltDependencies is the pnpm 10 equivalent of allowBuilds.
onlyBuiltDependencies:
  - "@vercel/speed-insights"
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - supabase
  - unrs-resolver

# Security overrides. Migrated 2026-07-25 from package.json "pnpm.overrides"
# (no longer read by pnpm 10 — those pins were silently inactive) and merged
# with the 2026-07-25 audit remediation. Re-audit with `pnpm audit --prod`.
overrides:
  protobufjs: ">=7.6.5 <8"
  form-data: ">=4.0.6"
  vite: "8.3.5"
  ws: ">=8.21.0"
  js-cookie: ">=3.0.7"
  postcss: ">=8.5.18"
  esbuild: ">=0.25.0"
  dompurify: ">=3.4.7"
  sharp: ">=0.35.0"
  "@opentelemetry/core": ">=2.8.0"
  # Keep each new security override within the major version already resolved.
  "brace-expansion@1": "1.1.21"
  "brace-expansion@5": "5.0.12"
  "js-yaml@4": "4.3.2"
  # GHSA-52f5-9888-hmc6 affects tmp <=0.2.3 (fixed 0.2.4); force only that range.
  "tmp@<0.2.4": "0.2.7"
  "browserslist@4": "4.28.7"
  "source-map-js@1": "1.2.2"
  "proxy-addr@2": "2.0.8"
  "compression@1": "1.8.2"
